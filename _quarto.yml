project:
  type: book
  output-dir: docs

book:
  title: "Quantitative and Reproducible Research with R in the Humanities"
  subtitle: "Block Seminar Materials"
  author: "Martin Schweinberger"
  date: today
  repo-url: https://github.com/MartinSchweinberger/R-4-HASS
  repo-actions: [edit, source, issue]
  chapters:
    - index.qmd
    # --- Unit 1: Introduction to R and RStudio
    - chapters/01-r_intro.qmd
    # --- Unit 2: Working with Data in R
    - chapters/02-data_loading.qmd
    # --- Unit 3: String Processing
    - chapters/03-string-processing.qmd
    # --- Unit 4: Regular Expressions
    - chapters/04-regular-expressions.qmd
    # --- Unit 5: Data Cleaning and Tables
    - chapters/05-tables.qmd
    # --- Unit 6: Data Visualisation with ggplot2
    - chapters/06-data_viz_intro.qmd
    # --- Unit 7: Statistics — Inferential Tests and Regression
    - chapters/07-statistics.qmd
    # --- Unit 8: Mixed-Effects Models
    - chapters/08-mixed-effects-models.qmd
    # --- Unit 9: Text Analysis (Corpus Methods)
    - chapters/09-text-analysis.qmd
    # --- Unit 10: Reproducible Research and Publishing (incorporates planned Unit 11)
    - chapters/10-publish.qmd
  appendices:
    - chapters/99-references.qmd

bibliography: references.bib

execute:
  freeze: auto
  warning: false
  message: false

format:
  html:
    theme: cosmo
    code-fold: false
    code-tools: true
    code-link: true
    toc: true
    toc-depth: 3
    number-sections: true
    fig-width: 7
    fig-height: 5

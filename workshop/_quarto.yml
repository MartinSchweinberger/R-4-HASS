project:
  type: website
  output-dir: _site

website:
  title: "R-4-HASS Workshop"
  description: "LMU Blockseminar — student workbooks for the four workshop days"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: day1.qmd
        text: Day 1
      - href: day2.qmd
        text: Day 2
      - href: day3.qmd
        text: Day 3
      - href: day4.qmd
        text: Day 4
    right:
      - icon: github
        href: https://github.com/MartinSchweinberger/R-4-HASS
      - icon: book
        href: https://martinschweinberger.github.io/R-4-HASS/
        text: Book

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    code-fold: false
    code-tools: true
    code-copy: true
    code-overflow: wrap
    df-print: paged
    highlight-style: github
    fontsize: 1.05em

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
